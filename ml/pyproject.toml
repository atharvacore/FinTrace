[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrace-ml"
version = "0.1.0"
description = "FinTrace offline training and evaluation pipeline, plus the shared feature code"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<1.9",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["fintrace_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["N803", "N806"]  # X, X_train etc. follow ML naming conventions

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
