name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrace
          POSTGRES_PASSWORD: fintrace-ci-only
          POSTGRES_DB: fintrace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintrace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINTRACE_TEST_DATABASE_URL: postgresql+psycopg://fintrace:fintrace-ci-only@localhost:5432/fintrace_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff check --config pyproject.toml ../scripts
      - name: Format check
        run: ruff format --check . && ruff format --check --config pyproject.toml ../scripts
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  ml:
    name: ML pipeline (lint + tests on the synthetic sample)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest
      - name: End-to-end smoke run (synthetic data, not results)
        run: python -m fintrace_ml.train ../data/sample/synthetic_transactions.csv --data-kind synthetic --out /tmp/artifacts
